name: Deploy

on:
  push:
    branches-ignore:
      - 'renovate/**'
  pull_request:

jobs:
  check:
    name: check (format, types, lint, migrations)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 26.13.1
      - name: Install pnpm
        run: npm install --global --force "$(node -p 'require("./package.json").packageManager.split("+")[0]')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm -C database exec tsgo && pnpm -C frontend exec quasar prepare && pnpm -r check
      - name: Lint
        run: pnpm lint --max-warnings=0
      - name: Check migrations
        run: |
          while true; do printf '\r'; sleep 0.1; done | pnpm -C database exec drizzle-kit generate --name '---ci-check---'
          MIGRATION_FILE=$(find database/drizzle -path '*ci-check*' -name 'migration.sql' || true)
          if [[ -n "$MIGRATION_FILE" ]]; then
            cat "$MIGRATION_FILE" >&2
            echo "::error::Uncommitted schema changes detected. Please generate migrations and commit them." >&2
            exit 1
          fi

  build-and-deploy:
    name: ${{ matrix.service }} (build and deploy)
    needs: check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        service: [database, api, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: postmodern.alexdaniel.org
          username: laundry-plugs
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            postmodern.alexdaniel.org/laundry-plugs-${{ matrix.service }}:${{ github.sha }}
            postmodern.alexdaniel.org/laundry-plugs-${{ matrix.service }}:latest
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=registry,ref=postmodern.alexdaniel.org/laundry-plugs-${{ matrix.service }}:latest
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Set SSH key
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Trust host
        if: github.ref == 'refs/heads/main'
        run: ssh-keyscan -H postmodern.alexdaniel.org >> ~/.ssh/known_hosts
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: docker stack deploy --with-registry-auth -c ${{ matrix.service }}/compose.yaml laundry-plugs-${{ matrix.service }}
        env:
          DOCKER_HOST: ssh://laundry-plugs@postmodern.alexdaniel.org
